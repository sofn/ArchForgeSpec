name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@1.34.5 lint api/openapi.yaml --format stylish
      - name: Check MenuTypeEnum contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("enums/enums.yaml").read_text()
          assert "name: MENU" in text and "value: 1" in text
          assert "name: CATALOG" in text
          assert "name: BUTTON" not in text.split("MenuTypeEnum:",1)[1].split("frontend:",1)[0]
          print("MenuTypeEnum contract ok")
          PY
      - name: Check live paths listed
        run: |
          grep -q "/admin/dashboard/metrics" specs/api-path.md
          grep -q "/admin/chat/config" specs/api-path.md
          grep -q "/web/user/articles" specs/api-path.md
          grep -q "/web/user/articles" api/openapi.yaml
          grep -q "CHAT_AI" specs/error-codes.md
          echo paths ok
