# repos.yaml — ArchForge Project Manifest
#
# Machine-readable map of the ArchForge multi-repository project.
# AI agents and scripts consume this file to discover sibling repositories,
# their roles, responsibility boundaries, and relationships.
#
# Layout convention: all repositories are cloned side by side (flat siblings):
#   archforge/
#   ├── ArchForge/        # backend (server-admin :8080 + server-web :8081)
#   ├── ArchForgeWeb/     # C-end web client
#   ├── ArchForgeAdmin/   # admin client (vue-pure-admin)
#   ├── ArchForgeDocs/    # documentation site (VitePress)
#   └── ArchForgeSpec/    # contracts / architecture / AI context  <- this repository
#
# NOTE: this file is derived from the actual source code, not a demo.
# Technology versions below were read from each repository's build files.

schemaVersion: 1

project:
  id: archforge
  name: ArchForge
  description: AI Native Enterprise Application Platform
  version: 2.0.0

workspace:
  directory: archforge

repositories:

  - id: core
    name: ArchForge
    path: ./ArchForge
    url: https://github.com/sofn/ArchForge
    role: backend
    group: com.lesofn.archforge
    stack:
      - Java 25 (preview enabled)
      - Spring Boot 4.1.0
      - Gradle (Kotlin DSL)
      - JPA / Hibernate (PostgreSQL)
      - Redis (Lettuce) / Redisson
      - Quartz (JDBC, clustered)
      - Sa-Token (bearer JWT)
      - springdoc OpenAPI 3.1
      - GraalVM native
    services:
      - id: server-admin
        port: 8080
        description: Admin REST API
      - id: server-web
        port: 8081
        description: Consumer web REST API
    modules:
      - common/common-base
      - common/common-jpa
      - common/common-error
      - infrastructure
      - dependencies
      - server-admin
      - server-web
      - domain/blog
      - domain/admin-user
      - domain/meta-table
      - starters/arch-forge-redisson-starter
      - starters/arch-forge-cache-starter
      - starters/arch-forge-lock-starter
      - starters/arch-forge-trace-starter
    can_modify:
      - api
      - domain
      - database
      - auth
      - workflow

  - id: web
    name: ArchForgeWeb
    path: ./ArchForgeWeb
    url: https://github.com/sofn/ArchForgeWeb
    role: web-client
    stack:
      - Next.js 15 (App Router)
      - React 19
      - TypeScript
      - Tailwind CSS v4
      - shadcn/ui
      - next-intl (i18n: en, zh)
      - pnpm workspaces + Turborepo
    consumes: server-web
    can_modify:
      - ui
      - client-routing
      - client-state

  - id: admin
    name: ArchForgeAdmin
    path: ./ArchForgeAdmin
    url: https://github.com/sofn/ArchForgeAdmin
    role: admin-client
    upstream: true
    base: vue-pure-admin 7.0
    stack:
      - Vue 3.5
      - Vite 8
      - TypeScript
      - Element Plus
      - Pinia
      - vue-router 5
      - vue-i18n
      - Tailwind CSS v4
    consumes: server-admin
    can_modify:
      - admin-ui

  - id: docs
    name: ArchForgeDocs
    path: ./ArchForgeDocs
    url: https://github.com/sofn/ArchForgeDocs
    role: documentation
    stack:
      - VitePress 1.6
    owns:
      - user-guide
      - module-docs
      - deploy-docs
    can_modify:
      - documentation

  - id: spec
    name: ArchForgeSpec
    path: ./ArchForgeSpec
    url: https://github.com/sofn/ArchForgeSpec
    role: specification
    owns:
      - api-contract
      - ui-schema
      - workflow-schema
      - permission-schema
      - agent-schema
      - project-architecture

relations:

  - from: ArchForgeWeb
    to: ArchForge
    type: api-consumer
    target: server-web

  - from: ArchForgeAdmin
    to: ArchForge
    type: api-consumer
    target: server-admin

  - from: ArchForge
    to: ArchForgeSpec
    type: implements

  - from: ArchForgeWeb
    to: ArchForgeSpec
    type: conforms

  - from: ArchForgeAdmin
    to: ArchForgeSpec
    type: conforms

  - from: ArchForgeDocs
    to: ArchForge
    type: documents

  - from: ArchForgeDocs
    to: ArchForgeSpec
    type: documents
