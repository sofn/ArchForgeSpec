openapi: 3.1.0
info:
  title: ArchForge API
  version: 0.1.0
  summary: Stub contract for ArchForge admin and C-end APIs.
  description: |
    Two servers, two clients:

    - **Admin** (`server-admin`, port 8080) — consumed by ArchForgeAdmin.
      Success envelope `{code, message, data}`. See `specs/api-response.md`.
    - **Web** (`server-web`, port 8081) — consumed by ArchForgeWeb.
      Errors use RFC 9457 ProblemDetail.

    This file is a **stub**. Paths listed here are the live surface we are
    willing to document. Do **not** reintroduce deleted `/system/menu` or
    `/system/role`. Leftover `/system/dict` is a migration backlog item
    (see `specs/api-path.md`), not a target prefix.

    When an endpoint changes, update this file in the same change.

servers:
  - url: http://localhost:8080
    description: server-admin (ArchForgeAdmin)
  - url: http://localhost:8081
    description: server-web (ArchForgeWeb)

tags:
  - name: admin-auth
    description: Admin sa-token login on server-admin
  - name: admin
    description: Admin resources under /admin/*
  - name: admin-legacy
    description: Admin paths still missing the /admin prefix
  - name: web
    description: C-end resources under /web/* on server-web

security:
  - saToken: []

paths:
  /auth/login:
    post:
      tags: [admin-auth]
      summary: Admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
      responses:
        "200":
          description: Wrapped login payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /auth/logout:
    post:
      tags: [admin-auth]
      summary: Admin logout
      responses:
        "200":
          description: Wrapped boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /auth/refresh-token:
    post:
      tags: [admin-auth]
      summary: Refresh admin token
      security: []
      responses:
        "200":
          description: Wrapped token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /auth/getConfig:
    get:
      tags: [admin-auth]
      summary: Public admin login config
      security: []
      responses:
        "200":
          description: Wrapped config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /auth/captchaImage:
    get:
      tags: [admin-auth]
      summary: Captcha image payload
      security: []
      responses:
        "200":
          description: Wrapped captcha
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /auth/getLoginUserInfo:
    get:
      tags: [admin-auth]
      summary: Current admin user
      responses:
        "200":
          description: Wrapped user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /auth/getRouters:
    get:
      tags: [admin-auth]
      summary: Dynamic admin routes
      responses:
        "200":
          description: Wrapped router tree
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /admin/user:
    post:
      tags: [admin]
      summary: Admin user page
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /admin/role:
    post:
      tags: [admin]
      summary: Admin role page
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /admin/menu:
    post:
      tags: [admin]
      summary: Admin menu list
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /admin/dept:
    post:
      tags: [admin]
      summary: Admin dept tree
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /admin/config:
    post:
      tags: [admin]
      summary: System config page
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /admin/notice:
    post:
      tags: [admin]
      summary: Notice page
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /admin/operation-log:
    post:
      tags: [admin]
      summary: Operation log page
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /admin/login-log:
    post:
      tags: [admin]
      summary: Login log page
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /admin/server:
    get:
      tags: [admin]
      summary: Server metrics
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /system/dict:
    description: |
      Leftover prefix. Migration backlog — move under `/admin/dict`.
      Not a template for new APIs. `/system/menu` and `/system/role` are gone
      and must not be re-added.
    post:
      tags: [admin-legacy]
      summary: Dictionary type page (legacy prefix)
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /blog/article:
    post:
      tags: [admin-legacy]
      summary: Blog article admin (prefix should become /admin/blog)
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /blog/category:
    post:
      tags: [admin-legacy]
      summary: Blog category admin
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /meta-table:
    post:
      tags: [admin-legacy]
      summary: Meta table admin
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /file:
    post:
      tags: [admin-legacy]
      summary: Admin file API
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /monitor:
    get:
      tags: [admin-legacy]
      summary: Monitor API
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /quartz:
    post:
      tags: [admin-legacy]
      summary: Quartz job admin
      responses:
        "200":
          $ref: "#/components/responses/AdminOk"

  /web/login:
    post:
      tags: [web]
      summary: C-end login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebLoginRequest"
      responses:
        "200":
          description: Wrapped login payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"
        "401":
          $ref: "#/components/responses/WebProblem"

  /web/logout:
    post:
      tags: [web]
      summary: C-end logout
      responses:
        "200":
          description: Wrapped boolean
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /web/refresh-token:
    post:
      tags: [web]
      summary: Refresh C-end token
      security: []
      responses:
        "200":
          description: Wrapped login payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"
        "401":
          $ref: "#/components/responses/WebProblem"

  /web/register:
    post:
      tags: [web]
      summary: Register by email
      security: []
      responses:
        "200":
          description: Wrapped login payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminEnvelope"

  /web/forgot-password:
    post:
      tags: [web]
      summary: Send reset-password code
      security: []
      responses:
        "200":
          description: Wrapped boolean

  /web/reset-password:
    post:
      tags: [web]
      summary: Reset password by email code
      security: []
      responses:
        "200":
          description: Wrapped boolean

  /web/verification-code/send:
    post:
      tags: [web]
      summary: Send email verification code
      security: []
      responses:
        "200":
          description: Wrapped boolean

  /web/user/profile:
    get:
      tags: [web]
      summary: Current C-end profile
      responses:
        "200":
          description: Wrapped profile
        "401":
          $ref: "#/components/responses/WebProblem"

  /web/user/change-password:
    post:
      tags: [web]
      summary: Change password while logged in
      responses:
        "200":
          description: Wrapped boolean
        "401":
          $ref: "#/components/responses/WebProblem"

  /web/dashboard/metrics:
    get:
      tags: [web]
      summary: C-end dashboard metrics
      responses:
        "200":
          description: Wrapped metrics

  /web/notices:
    get:
      tags: [web]
      summary: Latest notices
      responses:
        "200":
          description: Wrapped notice list

  /web/operation-logs:
    get:
      tags: [web]
      summary: Recent operation logs
      responses:
        "200":
          description: Wrapped log list

  /web/categories:
    get:
      tags: [web]
      summary: Visible article categories
      security: []
      responses:
        "200":
          description: Wrapped category list

  /web/articles:
    get:
      tags: [web]
      summary: Published articles
      security: []
      responses:
        "200":
          description: Wrapped page
    post:
      tags: [web]
      summary: Create article
      responses:
        "200":
          description: Wrapped article id
        "401":
          $ref: "#/components/responses/WebProblem"

  /web/articles/{slug}:
    get:
      tags: [web]
      summary: Published article by slug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Wrapped article

  /web/file/upload:
    post:
      tags: [web]
      summary: Upload C-end file
      responses:
        "200":
          description: Wrapped file payload
        "401":
          $ref: "#/components/responses/WebProblem"

  /web/file/{fileId}:
    get:
      tags: [web]
      summary: Download C-end file
      security: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Binary
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

components:
  securitySchemes:
    saToken:
      type: http
      scheme: bearer
      description: sa-token value. Header `Authorization: Bearer <token>`.

  responses:
    AdminOk:
      description: Admin envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AdminEnvelope"
    WebProblem:
      description: RFC 9457 Problem Detail (C-end errors)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    AdminEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 0 means success
        message:
          type: string
        data: {}

    AdminLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        captchaCode:
          type: string
        captchaKey:
          type: string

    WebLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          type: integer
          description: Optional ArchForge error code property
