# Cross-repo enumerations. Backend is the producer; this file is the contract;
# frontends consume it. See specs/enum-sync.md.
#
# Change flow: Java enum → this file → Admin / Web TypeScript constants.
# Never invent a frontend-only numeric mapping.

enums:
  StatusEnum:
    source: archforge-common-base
    class: com.lesofn.archforge.common.enums.common.StatusEnum
    dictionary: common.status
    field: status
    values:
      - name: DISABLE
        value: 0
        label: 停用
      - name: ENABLE
        value: 1
        label: 正常

  UserStatus:
    source: archforge-common-base
    class: com.lesofn.archforge.common.enums.common.UserStatusEnum
    dictionary: sysUser.status
    field: sys_user.status
    values:
      - name: NORMAL
        value: 1
        label: 正常
      - name: DISABLED
        value: 2
        label: 禁用
      - name: FROZEN
        value: 3
        label: 冻结

  MenuTypeEnum:
    source: archforge-domain/archforge-admin-user
    class: com.lesofn.archforge.user.api.enums.MenuTypeEnum
    dictionary: sysMenu.menuType
    field: sys_menu.menu_type
    # Canonical backend values. Buttons are NOT a menuType; they use is_button.
    values:
      - name: MENU
        value: 1
        label: 页面
      - name: CATALOG
        value: 2
        label: 目录
      - name: IFRAME
        value: 3
        label: 内嵌Iframe
      - name: OUTSIDE_LINK_REDIRECT
        value: 4
        label: 外链跳转
    frontend:
      repo: ArchForgeAdmin
      file: src/views/system/menu/utils/enums.ts
      rule: menuTypeOptions values must equal 1 / 2 / 3 / 4; buttons use isButton
